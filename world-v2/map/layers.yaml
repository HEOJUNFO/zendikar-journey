# 지도 v2 의 칸: 겹마다 한 글자가 한 칸이고, 범례는 글자 -> 지역 id 다 (sim/footprint.ts).
# 첫 겹(world.txt)은 지도 전체다. '.' 은 먼 바다(누구의 것도 아님).
# 다음 겹은 origin(왼쪽 위 칸)부터 대륙 안의 구역을 그 땅의 칸 위에 칠한다. 다음 겹의 '.' 은 그대로 둔다.
layers:
  - file: world.txt
    legend:
      S: loc-sejiri   # 세지리
      A: loc-akoum   # 아쿰
      B: loc-bala-ged   # 발라 게드
      G: loc-guul-draz   # 굴 드라즈
      T: loc-tazeem   # 타짐
      O: loc-ondu   # 온두
      M: loc-murasa   # 무라사
      a: loc-agadeem   # 아게딤
      b: loc-beyeen   # 베이엔
      j: loc-jwar-isle   # 즈와르 섬
      h: loc-halimar   # 할리마르
      s: loc-silundi-sea   # 실룬디 바다
      n: loc-narrow-waters   # 좁은 바다
  # 타짐 (2026-10-03): 지역 겹, 그다음 장소 겹. origin 은 [열, 행], world.txt 의 칸 자리.
  - file: tazeem.txt
    origin: [53, 60]
    legend:
      c: loc-calcite-flats   # 칼사이트 평원: 해안 고리
      w: loc-bulwark   # 성벽: 그 안쪽 고원 고리, 북쪽이 가장 높다
      o: loc-oran-rief   # 오란리프, 광대숲: 안쪽
      u: loc-umara-gorge   # 우마라 강 협곡: 북쪽 성벽 아래에서 할리마르로
      e: loc-emeria   # 에메리아, 하늘 폐허: 안쪽 가운데 하늘
  - file: tazeem-places.txt
    origin: [53, 60]
    legend:
      s: loc-sea-gate   # 바다 관문: 방파제 (칼사이트 평원)
      m: loc-merfolk-enclave   # 인어 은신처: 강어귀 섬 (협곡)
      t: loc-ula-temple   # 울라 신전: 강어귀 (협곡)
      f: loc-magosi   # 마고시, 물의 장막: 폭포와 운반 야영지 (협곡)
      y: loc-ruins-of-ysterid   # 이스테리드 폐허: 폭포 곁 구덩이 동굴 (오란리프)
      r: loc-wren-grotto   # 렌 동굴: 위쪽 협곡의 벼랑 동굴 (협곡)
      h: loc-north-hada   # 북하다: 강 발원지 고원 (성벽)
      p: loc-sunspring   # 햇샘: 높은 성벽 아래 평원 (칼사이트 평원)
      q: loc-halimar-sea-caves   # 할리마르 바다 동굴: 북쪽 기슭 (오란리프)
      j: loc-jade-room   # 비취 방: 남쪽 기슭으로 나오는 굴 (오란리프)
      v: loc-vastwood-village   # 광대숲 나무 위 마을 (오란리프)
      k: loc-southern-hedron-fields   # 남쪽 헤드론 들판: 남쪽 성벽 위 풀밭, 코르 장인의 야영지 (성벽)
  # 굴 드라즈 (2026-10-04): 지역 겹, 그다음 장소 겹.
  - file: guul-draz.txt
    origin: [70, 38]
    legend:
      d: loc-bordermire   # 보더마이어: 발라 게드와 잇는 북쪽 늪 목
      z: loc-zof-marsh   # 조프 늪: 북서쪽 맹그로브 해안
      h: loc-hanging-swamp   # 매달린 늪: 저수조 북쪽, 북쪽 해안의 싱크홀 늪
      k: loc-pelakka-karst   # 펠라카 카르스트: 저수조의 분지를 두른 석회암 말굽, 동쪽이 열림
      p: loc-piranha-marsh   # 피라냐 습지: 카르스트 안의 분지
      s: loc-hagra-swamp   # 하그라 늪: 가운데와 동쪽의 큰 늪
      j: loc-lake-jeft   # 제프트 호수: 남서쪽 호수와 물길, 좁은 바다를 보는 서해안
  - file: guul-draz-places.txt
    origin: [70, 38]
    legend:
      m: loc-malakir   # 말라키르: 분지 어귀의 둔덕 (하그라 늪)
      g: loc-ghet-estate   # 게트 구역: 말라키르 남쪽의 잠긴 구역 (하그라 늪)
      c: loc-hagra   # 하그라 저수조: 분지 한가운데의 폐허 (피라냐 습지)
      t: loc-thelzaia-sinkhole   # 텔자이아의 싱크홀: 서쪽 카르스트 깊은 곳 (카르스트)
      x: loc-helix-of-zof   # 조프의 나선: 맹그로브 한가운데 (조프 늪)
      f: loc-nimana   # 니마나 자유 도시: 남서쪽 해안의 만 머리 (제프트 호수)
      l: loc-lulea   # 룰레아: 호수 동쪽 기슭 (제프트 호수)
      o: loc-nirkana-outpost   # 니르카나 전초기지: 늪 목의 남쪽 어귀 (보더마이어)
      q: loc-marsh-grotto   # 늪 동굴: 북쪽 해안의 작은 물굽이 곁 (하그라 늪)
