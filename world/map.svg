<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <style>
    .name { font: 600 18px sans-serif; fill: #f4ecd8; }
    .terrain { font: 13px sans-serif; fill: #b9c3cf; }
    .area { font: 600 14px sans-serif; fill: #f4ecd8; }
  </style>
  <rect width="100%" height="100%" fill="#16324f"/>
  <circle cx="470" cy="510" r="50" fill="#d9c38a" fill-opacity="0.35" stroke="#f4ecd8" stroke-opacity="0.7" stroke-width="3"/>
  <circle cx="800" cy="320" r="110" fill="#b5462c" fill-opacity="0.35" stroke="#f4ecd8" stroke-opacity="0.7" stroke-width="3"/>
  <circle cx="580" cy="400" r="110" fill="#8fb35a" fill-opacity="0.35" stroke="#f4ecd8" stroke-opacity="0.7" stroke-width="3"/>
  <circle cx="480" cy="160" r="110" fill="#d9c38a" fill-opacity="0.35" stroke="#f4ecd8" stroke-opacity="0.7" stroke-width="3"/>
  <g><circle cx="470" cy="535" r="16" fill="#6a5a82" stroke="#f4ecd8" stroke-width="2"/>
    <text x="470" y="582" text-anchor="middle" class="area">아게딤의 묘실</text></g>
  <g><circle cx="800" cy="375" r="16" fill="#b08850" stroke="#f4ecd8" stroke-width="2"/>
    <text x="800" y="452" text-anchor="middle" class="area">아쿰 피난처</text></g>
  <g><circle cx="580" cy="455" r="16" fill="#8a8173" stroke="#f4ecd8" stroke-width="2"/>
    <text x="580" y="532" text-anchor="middle" class="area">메마른 메사</text></g>
  <g><circle cx="480" cy="215" r="16" fill="#b9c8ea" stroke="#f4ecd8" stroke-width="2"/>
    <text x="480" y="292" text-anchor="middle" class="area">에메리아</text></g>
  <g>
    <text x="470" y="432" text-anchor="middle" class="name">아게딤</text>
    <text x="470" y="450" text-anchor="middle" class="terrain">해변</text></g>
  <g>
    <text x="800" y="182" text-anchor="middle" class="name">아쿰</text>
    <text x="800" y="200" text-anchor="middle" class="terrain">화산 지대</text></g>
  <g>
    <text x="580" y="262" text-anchor="middle" class="name">온두</text>
    <text x="580" y="280" text-anchor="middle" class="terrain">초원</text></g>
  <g>
    <text x="480" y="22" text-anchor="middle" class="name">타짐</text>
    <text x="480" y="40" text-anchor="middle" class="terrain">해변</text></g>
</svg>
