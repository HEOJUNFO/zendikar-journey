<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <style>
    .name { font: 600 18px sans-serif; fill: #f4ecd8; }
    .terrain { font: 13px sans-serif; fill: #b9c3cf; }
    .area { font: 600 14px sans-serif; fill: #f4ecd8; }
  </style>
  <rect width="100%" height="100%" fill="#16324f"/>
  <circle cx="470" cy="510" r="70" fill="#d9c38a" fill-opacity="0.35" stroke="#f4ecd8" stroke-opacity="0.7" stroke-width="3"/>
  <circle cx="760" cy="340" r="70" fill="#b5462c" fill-opacity="0.35" stroke="#f4ecd8" stroke-opacity="0.7" stroke-width="3"/>
  <circle cx="580" cy="400" r="70" fill="#8fb35a" fill-opacity="0.35" stroke="#f4ecd8" stroke-opacity="0.7" stroke-width="3"/>
  <g><circle cx="470" cy="544" r="16" fill="#6a5a82" stroke="#f4ecd8" stroke-width="2"/>
